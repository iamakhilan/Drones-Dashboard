<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="AeroVIO animated hero: sensor data flows through visual inertial odometry and geometric flight control into live telemetry visualizations.">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B14"/><stop offset=".55" stop-color="#101629"/><stop offset="1" stop-color="#090D19"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9CA3AF" stroke-opacity=".08"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center}
 .float{animation:float 5s ease-in-out infinite}
 .dash{stroke-dasharray:8 12;animation:dash 8s linear infinite}
 @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @keyframes dash{to{stroke-dashoffset:-160}}
 @media (prefers-reduced-motion:reduce){.pulse,.float,.dash{animation:none}}
 </style>
</defs>
<rect width="1200" height="560" rx="22" fill="url(#bg)"/><rect width="1200" height="560" rx="22" fill="url(#grid)"/>
<circle cx="1050" cy="100" r="190" fill="#8B5CF6" opacity=".07"/><circle cx="100" cy="470" r="190" fill="#06B6D4" opacity=".06"/>
<text x="56" y="48" fill="#67E8F9" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">AEROVIO / AUTONOMOUS FLIGHT VISIBILITY</text>
<text x="56" y="104" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="43" font-weight="700">See the state.</text>
<text x="56" y="151" fill="#A78BFA" font-family="Arial,sans-serif" font-size="43" font-weight="700">Understand the flight.</text>
<text x="58" y="186" fill="#94A3B8" font-family="Arial,sans-serif" font-size="16">Visual-inertial estimation · Geometric control · Ground telemetry</text>
<g transform="translate(58 222)" font-family="Arial,sans-serif">
 <rect width="164" height="34" rx="17" fill="#102B3B" stroke="#155E75"/><circle cx="17" cy="17" r="4" fill="#22D3EE" class="pulse"/><text x="30" y="22" fill="#BAE6FD" font-size="12" font-weight="700">50 Hz CONTROL</text>
 <rect x="174" width="142" height="34" rx="17" fill="#21183C" stroke="#5B21B6"/><circle cx="191" cy="17" r="4" fill="#A78BFA" class="pulse"/><text x="204" y="22" fill="#DDD6FE" font-size="12" font-weight="700">MONOCULAR VIO</text>
</g>
<g transform="translate(58 290)" font-family="Arial,sans-serif">
 <text fill="#64748B" font-size="11" font-weight="700" letter-spacing="2">THE PIPELINE</text>
 <g class="float">
  <rect x="0" y="22" width="120" height="82" rx="12" fill="#10283B" stroke="#0EA5E9"/>
  <text x="60" y="52" fill="#7DD3FC" font-size="13" text-anchor="middle" font-weight="700">SENSORS</text><text x="60" y="74" fill="#CBD5E1" font-size="11" text-anchor="middle">Camera + IMU</text>
 </g>
 <path d="M122 63H150" stroke="#67E8F9" stroke-width="2" class="dash"/>
 <g class="float" style="animation-delay:-1s">
  <rect x="152" y="22" width="136" height="82" rx="12" fill="#211A3C" stroke="#8B5CF6"/>
  <text x="220" y="52" fill="#C4B5FD" font-size="13" text-anchor="middle" font-weight="700">VIO / MSCKF</text><text x="220" y="74" fill="#CBD5E1" font-size="11" text-anchor="middle">Pose + 3D map</text>
 </g>
 <path d="M290 63H318" stroke="#A78BFA" stroke-width="2" class="dash"/>
 <g class="float" style="animation-delay:-2s">
  <rect x="320" y="22" width="142" height="82" rx="12" fill="#10352F" stroke="#10B981"/>
  <text x="391" y="52" fill="#6EE7B7" font-size="13" text-anchor="middle" font-weight="700">SO(3) CONTROL</text><text x="391" y="74" fill="#CBD5E1" font-size="11" text-anchor="middle">Force → attitude</text>
 </g>
 <path d="M464 63H492" stroke="#6EE7B7" stroke-width="2" class="dash"/>
 <g class="float" style="animation-delay:-3s">
  <rect x="494" y="22" width="138" height="82" rx="12" fill="#392B1B" stroke="#F59E0B"/>
  <text x="563" y="52" fill="#FCD34D" font-size="13" text-anchor="middle" font-weight="700">TELEMETRY</text><text x="563" y="74" fill="#CBD5E1" font-size="11" text-anchor="middle">Bridge → UI</text>
 </g>
</g>
<!-- animated telemetry panel -->
<g transform="translate(748 74)">
 <rect width="394" height="402" rx="18" fill="#0B1220" stroke="#344155" stroke-width="1.3"/>
 <path d="M0 52H394" stroke="#283548"/>
 <circle cx="22" cy="26" r="4" fill="#FB7185"/><circle cx="38" cy="26" r="4" fill="#FBBF24"/><circle cx="54" cy="26" r="4" fill="#34D399"/>
 <text x="76" y="30" fill="#CBD5E1" font-size="12" font-family="Arial,sans-serif" font-weight="700">AEROVIO / TELEMETRY MONITOR</text>
 <text x="20" y="80" fill="#94A3B8" font-family="Arial,sans-serif" font-size="11">POSITION ERROR · ROLLING SIGNAL</text>
 <g transform="translate(20 94)">
  <rect width="354" height="92" rx="8" fill="#101A2B" stroke="#263449"/>
  <path d="M0 23H354M0 46H354M0 69H354M59 0V92M118 0V92M177 0V92M236 0V92M295 0V92" stroke="#64748B" stroke-opacity=".18"/>
  <path d="M4 54 C22 54 24 20 42 28 S60 75 80 60 S100 18 120 35 S146 72 164 51 S188 29 204 43 S226 78 245 51 S271 27 289 43 S322 58 350 25" fill="none" stroke="#22D3EE" stroke-width="2.5" filter="url(#glow)" class="dash"/>
  <path d="M4 67 C27 63 38 72 54 65 S81 48 98 61 S122 71 142 62 S173 48 194 64 S217 69 237 60 S267 46 288 62 S324 73 350 55" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-opacity=".8"/>
 </g>
 <text x="20" y="215" fill="#94A3B8" font-family="Arial,sans-serif" font-size="11">STATE ESTIMATION</text>
 <rect x="20" y="230" width="168" height="62" rx="9" fill="#101A2B" stroke="#263449"/>
 <text x="34" y="252" fill="#64748B" font-family="Arial,sans-serif" font-size="10">BODY POSE</text><text x="34" y="275" fill="#E2E8F0" font-family="monospace" font-size="16">T<tspan baseline-shift="sub" font-size="11">WB</tspan> <tspan fill="#34D399">●</tspan></text>
 <rect x="204" y="230" width="170" height="62" rx="9" fill="#101A2B" stroke="#263449"/>
 <text x="218" y="252" fill="#64748B" font-family="Arial,sans-serif" font-size="10">CAMERA POSE</text><text x="218" y="275" fill="#E2E8F0" font-family="monospace" font-size="16">T<tspan baseline-shift="sub" font-size="11">WC</tspan> <tspan fill="#A78BFA">●</tspan></text>
 <text x="20" y="325" fill="#94A3B8" font-family="Arial,sans-serif" font-size="11">CONTROL LOOP</text>
 <rect x="20" y="340" width="354" height="42" rx="9" fill="#102F2C" stroke="#047857"/>
 <circle cx="39" cy="361" r="5" fill="#34D399" class="pulse"/><text x="54" y="365" fill="#A7F3D0" font-family="Arial,sans-serif" font-size="12" font-weight="700">50 Hz</text><text x="117" y="365" fill="#D1FAE5" font-family="Arial,sans-serif" font-size="12">Outer loop → SO(3) → FSM</text>
</g>
<text x="58" y="538" fill="#64748B" font-family="Arial,sans-serif" font-size="11">A VISUAL GROUND STATION FOR STATE ESTIMATION AND CONTROL INSPECTION</text>
</svg>