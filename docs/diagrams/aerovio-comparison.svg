<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Animated AeroVIO comparison: scattered drone telemetry on the left, a unified ground station workflow on the right.">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080C15"/><stop offset="1" stop-color="#13192B"/></linearGradient>
 <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#94A3B8" stroke-opacity=".06"/></pattern>
 <style>
 .blink{animation:blink 2.4s ease-in-out infinite}.rise{animation:rise 3s ease-in-out infinite}.travel{stroke-dasharray:7 9;animation:travel 7s linear infinite}
 @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes travel{to{stroke-dashoffset:-160}}
 @media(prefers-reduced-motion:reduce){.blink,.rise,.travel{animation:none}}
 </style>
</defs>
<rect width="1200" height="520" rx="20" fill="url(#bg)"/><rect width="1200" height="520" rx="20" fill="url(#grid)"/>
<text x="52" y="48" fill="#94A3B8" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">WHY AEROVIO</text>
<text x="52" y="84" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="28" font-weight="700">From fragmented signals to one flight picture</text>
<rect x="48" y="116" width="516" height="346" rx="16" fill="#17131D" stroke="#7F1D1D" stroke-opacity=".7"/>
<rect x="584" y="116" width="568" height="346" rx="16" fill="#0B191A" stroke="#0F766E" stroke-opacity=".8"/>
<text x="74" y="151" fill="#FCA5A5" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">WITHOUT A UNIFIED VIEW</text>
<text x="610" y="151" fill="#6EE7B7" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">THE AEROVIO APPROACH</text>
<!-- scattered panels -->
<g class="rise">
 <rect x="76" y="177" width="202" height="104" rx="9" fill="#111827" stroke="#7F1D1D"/><text x="91" y="198" fill="#FCA5A5" font-family="Arial,sans-serif" font-size="11">POSITION LOG</text><path d="M91 250L112 236L133 255L155 218L174 240L196 214L219 236L262 204" fill="none" stroke="#FB7185" stroke-width="2"/>
 <rect x="310" y="198" width="214" height="90" rx="9" fill="#111827" stroke="#7F1D1D"/><text x="325" y="219" fill="#FCA5A5" font-family="Arial,sans-serif" font-size="11">FRAME CONFUSION?</text><text x="325" y="249" fill="#E5E7EB" font-family="monospace" font-size="14">T_WB ≠ T_WC</text><text x="325" y="270" fill="#9CA3AF" font-family="Arial,sans-serif" font-size="11">Body and camera pose</text>
 <rect x="90" y="306" width="180" height="82" rx="9" fill="#111827" stroke="#7F1D1D"/><text x="105" y="328" fill="#FCA5A5" font-family="Arial,sans-serif" font-size="11">RATE / STATUS</text><circle cx="112" cy="353" r="5" fill="#FB7185" class="blink"/><text x="125" y="357" fill="#D1D5DB" font-family="Arial,sans-serif" font-size="12">Unclear freshness</text>
 <rect x="296" y="325" width="228" height="63" rx="9" fill="#111827" stroke="#7F1D1D"/><text x="313" y="350" fill="#D1D5DB" font-family="Arial,sans-serif" font-size="12">Disconnected graphs</text><path d="M313 368H501" stroke="#7F1D1D" stroke-dasharray="4 5"/>
</g>
<!-- unified pipeline -->
<g class="rise">
 <rect x="612" y="180" width="510" height="64" rx="10" fill="#102B3B" stroke="#0E7490"/><text x="632" y="205" fill="#7DD3FC" font-family="Arial,sans-serif" font-size="14" font-weight="700">STATE + PERCEPTION</text><text x="632" y="227" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="12">Body pose · camera pose · sparse 3D map</text>
 <path d="M867 245V265" stroke="#22D3EE" stroke-width="2" class="travel"/>
 <rect x="612" y="267" width="510" height="64" rx="10" fill="#12342D" stroke="#047857"/><text x="632" y="292" fill="#6EE7B7" font-family="Arial,sans-serif" font-size="14" font-weight="700">CASCADED FLIGHT CONTROL</text><text x="632" y="314" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="12">Position → thrust / attitude → geometric SO(3)</text>
 <path d="M867 332V352" stroke="#34D399" stroke-width="2" class="travel"/>
 <rect x="612" y="354" width="510" height="68" rx="10" fill="#302047" stroke="#7C3AED"/><text x="632" y="380" fill="#DDD6FE" font-family="Arial,sans-serif" font-size="14" font-weight="700">GROUND STATION</text><text x="632" y="402" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="12">3D map · camera HUD · rolling telemetry · status</text>
</g>
<text x="74" y="432" fill="#9CA3AF" font-family="Arial,sans-serif" font-size="11">SCATTERED · HARD TO CORRELATE</text><text x="610" y="442" fill="#6EE7B7" font-family="Arial,sans-serif" font-size="11">ONE PIPELINE · CLEARER INSPECTION</text>
</svg>